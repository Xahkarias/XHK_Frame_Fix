 giga_frameworld_docs_conquest_desc:0 "Conquered worlds will have their population resettled to the §Y$pc_giga_frameworld$§! at a rate of §Y400 pops per month§! or §Y5% of the population, whichever is higher§!. When emptied, a §Y$giga_frameworld_outpost$§! will be automatically created over the former colony.\n\nWorlds conquered from §Y$pc_giga_frameworld$§! empires have their §Y$giga_frameworld_outpost_plural$§! wrecked. Wrecked outposts can be repaired if the system is reacquired."

