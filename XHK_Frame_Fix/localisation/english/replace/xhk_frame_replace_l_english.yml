 giga_frameworld_nanites_effect:0 "Enables Expansion decisions costing £nanites£ §Y$nanites$§!\n\nRetrofits several Districts with nanotechnology:\n\n§H$district_giga_frameworld_foundry$:§!\n- Produces additional £alloys£ §Y$alloys$§! directly\n- Increased £energy£ §Y$energy$§! Upkeep\n- Additional £nanites£ §Y$nanites$§! Upkeep\n\n§H$district_giga_frameworld_science$:§!\n- Adds 30 [owner.GetResearcherIcon] §Y[owner.GetResearcher]§! Jobs\n- Additional £nanites£ §Y$nanites$§! Upkeep\n\n§H$district_giga_frameworld_refinery$:§!\n- Produces additional $giga_r_motes$$giga_r_gases$$giga_r_crystals$ §YStrategic Resources§! directly\n- Increased £energy£ §Y$energy$§! Upkeep\n- Additional £nanites£ §Y$nanites$§! Upkeep\n "
